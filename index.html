<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тая · прототип</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Источник всех размеров и цветов — макеты Figma (файл 1uIh433kyyqcUGAKbHYNck, секция «Макеты») */
:root{
  --text:#333; --text2:#9299a2; --blue:#0064fa; --blue-bg:rgba(47,172,254,.1); --grey-bg:rgba(0,16,36,.04);
  --neutral:rgba(0,16,36,.03); --info:#428bf9; --green:#3aa981;
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",Inter,system-ui,sans-serif;
  --sfr:ui-rounded,"SF Pro Rounded",-apple-system,"SF Pro Text",Inter,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#e9eaee;font-family:var(--sf);color:var(--text);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
p{margin:0}

/* телефон */
.phone{position:relative;width:375px;height:852px;border-radius:44px;overflow:hidden;background:#fff;box-shadow:0 0 0 10px #111,0 30px 80px rgba(20,24,40,.3);flex:none}
@media (max-width:500px),(max-height:880px) and (max-width:820px){
  body{display:block;background:#fff}
  .phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
}
.scr{position:absolute;inset:0;overflow:hidden;background:#fff}
.scr[hidden]{display:none!important}
.bg{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hot{position:absolute;display:block}
.fix{position:absolute;left:0;top:0;width:375px;height:852px;transform-origin:0 0;overflow:hidden}

/* экран блокировки */
#lock{background:#0b2a4a}
#lock .lk{position:absolute;top:0;left:50%;height:100%;aspect-ratio:402/874;transform:translateX(-50%)}
#lock .bg{width:100%;height:100%}
#lock .push{position:absolute;left:4.98%;width:90.05%;top:76.43%;height:7.32%;border-radius:24px;animation:drop .6s .4s both;touch-action:pan-y;cursor:grab}
#lock .push.settling{transition:transform .28s cubic-bezier(.2,.9,.3,1)}
#lock .hint{position:absolute;left:0;right:0;top:86%;text-align:center;color:rgba(255,255,255,.65);font-size:13px;font-weight:500;animation:drop .6s .6s both;pointer-events:none}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}}

/* виджеты Таи поверх банковских экранов */
.taya-ava{width:40px;height:40px;border-radius:100px;flex:none;display:block;object-fit:cover}
.w-home{position:absolute;left:7px;top:593px;width:352px;height:80px;background:#fff;border-radius:20px;display:flex;gap:12px;align-items:center;padding:16px 16px 16px 20px;filter:drop-shadow(0 6px 17px rgba(0,16,36,.08))}
.w-home .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.w-home b{color:#333;font-weight:590;font-size:17px;letter-spacing:-.41px}
.w-home span{font-size:14px;color:var(--text2)}
.w-card{position:absolute;left:16px;top:474px;width:343px;background:#fff;border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px;filter:drop-shadow(0 6px 17px rgba(0,16,36,.08))}
.w-card .top{display:flex;gap:10px;align-items:center}
.w-card .top img{width:32px;height:32px;border-radius:100px}
.w-card .top b{font-weight:590;font-size:17px;letter-spacing:-.41px}
.w-card p{font-size:16px;line-height:21px}
.w-card .chips{display:flex;gap:8px;padding-top:8px}
.tchip{height:30px;display:flex;align-items:center;padding:0 7px;border-radius:30px;background:var(--blue-bg)}
.tchip span{display:block;padding:7px;width:84px;font-weight:590;font-size:13px;color:var(--blue);white-space:nowrap}

/* чат */
#chat{display:flex;flex-direction:column}
.sb{height:44px;position:relative;flex:none}
.sb img{position:absolute;top:50%;display:block}
.topnav{flex:none;background:#fff;position:relative;z-index:3}
.navrow{height:44px;margin:0 16px 10px;display:flex;justify-content:space-between;align-items:center}
.lead{display:flex;gap:16px;align-items:center;height:44px}
.glass{height:44px;min-width:44px;border-radius:296px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.72);box-shadow:0 2px 14px rgba(0,0,0,.08),inset 0 0 0 .5px rgba(0,0,0,.04);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.glass.back{padding:0 7px}
.glass.right{padding:0 10px;gap:24px}
.flat{display:flex;gap:8px;align-items:center}
.flat img{width:36px;height:36px;border-radius:100px}
.flat b{font-weight:590;font-size:17px;letter-spacing:-.41px}
.mask{display:block;width:24px;height:24px;background:var(--c,#333);-webkit-mask:var(--m) 0 0/var(--s,24px 24px) no-repeat;mask:var(--m) 0 0/var(--s,24px 24px) no-repeat}
#feedwrap{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#feedwrap::-webkit-scrollbar{display:none}
#feed{display:flex;flex-direction:column;gap:20px;padding:12px 16px 140px}

/* стартовое состояние (экран 3) */
#intro{position:absolute;inset:0;z-index:1}
#intro .status-block{position:absolute;left:0;width:100%;top:calc(50% - 46px);transform:translateY(-50%);padding:32px 16px}
#intro .status-block p{font-weight:700;font-size:20px;letter-spacing:.38px}
#intro .btns{position:absolute;left:0;top:428px;width:298px;padding:0 16px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.tbtn{display:flex;align-items:center;padding:10px;border-radius:999px;background:var(--blue-bg)}
.tbtn.grey{background:var(--grey-bg)}
.tbtn span{display:block;padding:3px 8px;font-size:15px;letter-spacing:-.24px;color:var(--blue);white-space:nowrap}
.tbtn.grey span{color:#333}
.tbtn img,.tbtn .mask{width:24px;height:24px;flex:none}

/* сообщения */
.um{display:flex;justify-content:flex-end;padding-left:32px}
.um div{flex:1;background:var(--blue-bg);border-radius:14px;padding:8px 10px;font-size:17px;letter-spacing:-.41px}
.ans{display:flex;flex-direction:column}
.ans > *{animation:rise .35s both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.h1{font-weight:700;font-size:30px;letter-spacing:.36px}
.h2{font-weight:700;font-size:20px;letter-spacing:.38px;padding-top:20px}
.para{padding-top:12px;font-size:17px;letter-spacing:-.41px}
.li{display:flex;gap:8px;font-size:17px;letter-spacing:-.41px;padding-top:8px}
.li.first{padding-top:12px}
.bli{display:flex;gap:12px;padding:8px 0 0 6px;font-size:17px;letter-spacing:-.41px}
.bli.first{padding-top:12px}
.bli img{width:6px;height:6px;margin-top:7px;flex:none}
.quote{margin-top:16px;background:var(--neutral);border-left:3px solid var(--info);padding:12px 16px;font-size:17px;letter-spacing:-.41px}
.hr{display:block;width:100%;height:20px}
.actions{display:flex;justify-content:space-between;align-items:center;padding-top:12px}
.actions .l{display:flex;gap:2px}
.act{min-height:30px;padding:3px 7px;display:flex;align-items:center;justify-content:center}
.act .mask{width:16px;height:16px;--s:16px 16px;--c:rgba(0,0,0,.48)}
.act.on .mask{--c:var(--blue)}
.foot{padding-top:12px;display:flex;flex-direction:column;gap:8px;font-size:13px;letter-spacing:-.08px;color:var(--text2)}
.sugg{padding-top:20px;display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;padding:0 7px;border-radius:30px;background:var(--blue-bg)}
.chip span{display:block;padding:7px 4px;font-weight:590;font-size:13px;letter-spacing:-.08px;color:var(--blue);white-space:nowrap}
.chip.grey{background:var(--grey-bg)}
.chip.grey span{color:#333}
.sugg.used{display:none}

/* график */
.chart{margin-top:16px;background:var(--neutral);border-radius:24px;padding:16px 16px 14px;overflow:hidden}
.chart .big{font-family:var(--sfr);font-weight:700;font-size:30px;letter-spacing:-.5px}
.chart .cap{font-size:13px;color:var(--text2)}
.plot{position:relative;height:136px;margin-top:10px;overflow:hidden}
.plot > div{position:absolute}
.plot img{position:absolute;display:block;max-width:none}
.xaxis{display:flex;justify-content:space-between;font-size:12px;color:var(--text2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 8px;padding-top:16px}
.legend div{height:30px;background:#fff;border-radius:99px;padding:0 8px;display:flex;gap:4px;align-items:center;font-size:12px;color:var(--text2)}
.legend img{width:12px;height:12px}

/* операции */
.grp{padding-top:20px;display:flex;flex-direction:column;gap:4px}
.gh{display:flex;justify-content:space-between;align-items:baseline;white-space:nowrap}
.gh b{font-weight:700;font-size:20px}
.gh span{font-size:13px;color:var(--text2)}
.op{display:flex;gap:12px;align-items:center;padding:10px 0;width:100%}
.op .av{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-weight:590;font-size:15px;flex:none}
.op .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;white-space:nowrap}
.op .tx b{font-weight:400;font-size:17px;letter-spacing:-.41px}
.op .tx span{font-size:13px;color:var(--text2)}
.op .sum{font-size:17px;letter-spacing:-.41px;color:var(--green);white-space:nowrap}

/* варианты */
.opts{padding-top:16px;display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:center;padding:16px 12px 16px 16px;border-radius:16px;background:var(--neutral);width:100%}
.opt:active{background:rgba(0,16,36,.07)}
.opt .ib{width:44px;height:44px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.opt .ib img{width:24px;height:24px}
.opt .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.opt .tx b{font-weight:590;font-size:17px;letter-spacing:-.41px}
.opt .tx span{font-size:15px;letter-spacing:-.24px;color:var(--text2)}
.opt .tx i{font-style:normal;background:rgba(0,16,36,.06);border-radius:6px;padding:2px 6px;font-weight:590;font-size:11px;color:var(--text2)}
.opt .chev{width:16px;height:16px;flex:none}

/* скелетон генерации */
.skel{display:flex;flex-direction:column;gap:12px}
.skel .row{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--text2)}
.skel .row img{width:24px;height:24px;border-radius:100px;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skel i{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,#f1f2f4 0%,#e3e5e9 40%,#f1f2f4 80%);background-size:300% 100%;animation:shim 1.2s linear infinite}
.skel i.h{height:26px;width:78%;border-radius:10px}
@keyframes shim{from{background-position:100% 0}to{background-position:-200% 0}}

/* поле ввода */
.panel{position:absolute;left:16px;right:16px;bottom:30px;height:80px;border-radius:24px;padding:8px;z-index:4;background:rgba(255,255,255,.82);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);filter:drop-shadow(0 6px 17px rgba(0,0,0,.12));display:flex;flex-direction:column;gap:4px}
.panel .in{height:30px;display:flex;align-items:center;padding-left:8px;font-size:17px;letter-spacing:-.41px;color:var(--text2)}
.panel .bot{display:flex;gap:4px;align-items:center}
.panel .pl{min-height:30px;padding:3px 7px;display:flex;align-items:center}
.panel .pl .mask{width:16px;height:16px;--s:16px 16px;--c:var(--text2)}
.panel .sk{background:var(--neutral);border-radius:30px;padding:0 7px}
.panel .sk span{display:block;padding:7px 4px;font-weight:590;font-size:13px;letter-spacing:-.08px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="phone" id="phone">

  <!-- экран блокировки (Figma: Notifications 19:8175) -->
  <section class="scr" id="lock">
   <div class="fix">
    <div class="lk">
      <img class="bg" src="fig/bg-lock.jpg" alt="Экран блокировки: пуш Т-Банка «Алексей К. Перевод 1 500 ₽»">
      <button class="hot push" id="push" data-go="receipt" aria-label="Открыть пуш Т-Банка"></button>
      <div class="hint">Смахните пуш, чтобы открыть</div>
    </div>
   </div>
  </section>

  <!-- чек перевода (Figma: 2a 20:421) -->
  <section class="scr" id="receipt" hidden style="background:#fff">
   <div class="fix">
    <img class="bg" src="fig/bg-receipt.jpg" alt="" style="position:absolute;left:0;top:0;width:100%;height:852px;object-fit:cover;object-position:top;clip-path:inset(0 0 398px 0)">
    <div style="position:absolute;left:0;right:0;top:454px;bottom:0;background:#fff"></div>
    <button class="hot" style="left:0;top:56px;width:110px;height:56px" data-go="home" aria-label="Закрыть"></button>
    <div class="w-card" id="receiptCard">
      <div class="top"><img src="fig/taya-avatar.png" alt="" width="32" height="32" style="border-radius:100px"><b>Тая заметила</b></div>
      <p>Третий месяц подряд под конец месяца вам переводят знакомые. Разберём, в чём дело?</p>
      <div class="chips">
        <button class="tchip" data-chat="receipt"><span>Разобрать</span></button>
        <button class="tchip" data-dismiss="receiptCard"><span>Не сейчас</span></button>
      </div>
    </div>
   </div>
  </section>

  <!-- главная (Figma: 2b 20:625) -->
  <section class="scr" id="home" hidden>
   <div class="fix">
    <img class="bg" src="fig/bg-home.jpg" alt="">
    <button class="w-home" data-chat="home">
      <span class="t"><b>Тая заметила</b><span>Конец месяца бывает напряжённым</span></span>
      <img class="taya-ava" src="fig/taya-avatar.png" alt="Тая">
    </button>
   </div>
  </section>

  <!-- чат Таи (Figma: 3–8) -->
  <section class="scr" id="chat" hidden>
    <div class="topnav">
      <div class="sb">
        <img src="fig/sb-time.svg" alt="" style="left:34px;width:28.426px;height:11.089px;transform:translateY(calc(-50% + .54px))">
        <img src="fig/sb-signal.svg" alt="" style="right:18px;width:63px;height:10px;transform:translateY(calc(-50% + 1px))">
        <img src="fig/sb-battery.svg" alt="" style="right:14px;width:25px;height:12px;transform:translateY(calc(-50% + 1px))">
      </div>
      <div class="navrow">
        <div class="lead">
          <button class="glass back" id="chatBack" aria-label="Назад"><img src="fig/ic-back.svg" width="24" height="24" alt=""></button>
          <div class="flat"><img src="fig/taya-avatar.png" alt="" id="hdrAva"><b>Тая ИИ</b></div>
        </div>
        <div class="glass right">
          <span class="mask" style="--m:url(fig/ic-chat-plus.svg)"></span>
          <span class="mask" style="--m:url(fig/ic-list.svg)"></span>
        </div>
      </div>
    </div>
    <div id="feedwrap">
      <div id="intro">
        <div class="status-block"><p>Заметила кое‑что переводах за последние 3 месяца. Разберём вместе?</p></div>
        <div class="btns">
          <button class="tbtn" data-ask="diag"><span class="mask" style="--c:#0064fa;--m:url(fig/ic-compare.svg);-webkit-mask-position:1.126px 3px;mask-position:1.126px 3px;--s:21.749px 18px"></span><span>Да, покажи разбор</span></button>
          <button class="tbtn" data-ask="why"><img src="fig/ic-note-check.svg" alt=""><span>Почему ты мне пишешь?</span></button>
          <button class="tbtn grey" data-ask="later"><span>Не сейчас</span></button>
        </div>
      </div>
      <div id="feed"></div>
    </div>
    <div class="panel">
      <div class="in">Отвечу на вопросы</div>
      <div class="bot"><span class="pl"><span class="mask" style="--m:url(fig/ic-plus-small.svg)"></span></span><span class="sk"><span>Навыки</span></span></div>
    </div>
  </section>
</div>

<!-- общие куски ответа Таи -->
<template id="tail">
  <img class="hr" src="fig/hr.svg" alt="">
  <div class="actions">
    <div class="l">
      <button class="act" aria-label="Скопировать"><span class="mask" style="--m:url(fig/ic-copy.svg)"></span></button>
      <button class="act" data-toggle aria-label="Нравится"><span class="mask" style="--m:url(fig/ic-up.svg)"></span></button>
      <button class="act" data-toggle aria-label="Не нравится"><span class="mask" style="--m:url(fig/ic-down.svg)"></span></button>
    </div>
    <button class="act" aria-label="Ещё"><span class="mask" style="--m:url(fig/ic-more.svg);--c:#9299a2"></span></button>
  </div>
  <div class="foot"><p>Ответ сгенерирован ИИ и может содержать неточности. Проверяйте важную информацию.</p><p>Подробнее — в правилах сервиса</p></div>
</template>

<!-- 4 · диагноз (15:44) -->
<template id="a-diag">
  <p class="h1">Под конец месяца бывает тяжело</p>
  <p class="para">Последние 3 месяца с 25 по 30 число остаток на карте опускается ниже того, что вы обычно тратите за 3 дня. В эти же дни вам переводят деньги знакомые.</p>
  <div class="chart">
    <p class="big">около 300 ₽</p>
    <p class="cap">Остаток по карте в последние дни месяца. Обычно за 3 дня в доугие дни — 4 200 ₽</p>
    <div class="plot">
      <div style="inset:14.23% 0 0 0"><img src="fig/ch-area.svg" alt="" style="inset:0;width:100%;height:100%"></div>
      <div style="inset:54.41% 0 45.59% 0"><img src="fig/ch-base.svg" alt="" style="left:-.24%;right:-.24%;top:-.75px;bottom:-.75px;width:100.48%;height:1.5px"></div>
      <div style="inset:14.23% 0 5.06% 0"><img src="fig/ch-line.svg" alt="" style="left:-.4%;top:-1.14%;width:100.8%;height:102.28%"></div>
      <div style="inset:79.04% 69.55% 14.34% 27.56%"><img src="fig/ch-dot.svg" alt="" style="left:-13.89%;top:-13.89%;width:127.78%;height:127.78%"></div>
      <div style="inset:79.04% 36.21% 14.34% 60.9%"><img src="fig/ch-dot.svg" alt="" style="left:-13.89%;top:-13.89%;width:127.78%;height:127.78%"></div>
      <div style="inset:79.04% 2.89% 14.34% 94.21%"><img src="fig/ch-dot.svg" alt="" style="left:-13.89%;top:-13.89%;width:127.78%;height:127.78%"></div>
    </div>
    <div class="xaxis"><span>сентябрь</span><span>октябрь</span><span>ноябрь</span></div>
    <div class="legend"><div><img src="fig/lg-line.svg" alt="">остаток на карте</div><div><img src="fig/lg-dot.svg" alt="">дни, когда занимали</div></div>
  </div>
  <p class="h2">На чём основан вывод</p>
  <div class="li first"><span>1.</span><span>Остаток ниже трёхдневного расхода — 3 месяца подряд</span></div>
  <div class="li"><span>2.</span><span>В эти дни — 7 входящих переводов от 3 человек</span></div>
  <div class="li"><span>3.</span><span>После зарплаты вы возвращали те же суммы тем же людям — похоже на займы до зарплаты</span></div>
  <slot data-tail></slot>
  <div class="sugg">
    <button class="chip" data-ask="ops"><span>Покажи эти операции</span></button>
    <button class="chip" data-ask="options"><span>Что можно сделать?</span></button>
    <button class="chip grey" data-ask="notme"><span>Это не про меня</span></button>
  </div>
</template>

<!-- 5 · операции (17:73) -->
<template id="a-ops">
  <p class="h1">Переводы с 25 по 30 число</p>
  <p class="para">Вот на каких операциях основан вывод. Нажмите на любую — она откроется в истории.</p>
  <div class="grp"><div class="gh"><b>Ноябрь</b><span>остаток 27-го — 340 ₽</span></div>

<!-- ответы, которых нет на макетах: собраны из тех же блоков -->
<template id="a-short"><p class="para" style="padding-top:0" data-text></p><slot data-tail></slot></template>

<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  var screens = ['lock','receipt','home','chat'], cameFrom = 'home', busy = false;
  var feed = $('#feed'), wrap = $('#feedwrap'), intro = $('#intro');

  var Q = {
    diag:   { q:'Да, покажи разбор', a:'a-diag' },
    ops:    { q:'Покажи эти операции', a:'a-ops' },
    options:{ q:'Что можно сделать?', a:'a-options' },
    kub:    { q:'Кубышка на всякий случай', a:'a-kub' },
    why:    { q:'Почему ты мне пишешь?', t:'Я замечаю закономерности в ваших операциях, чтобы вовремя подсказать. Это не реклама — подсказки можно отключить в настройках.', next:['diag','later'] },
    later:  { q:'Не сейчас', t:'Хорошо. Вернусь к этому, когда вам будет удобно.', end:true },
    notme:  { q:'Это не про меня', t:'Поняла. Скрою это наблюдение на 3 месяца, а если картина повторится — сначала спрошу.', end:true },
    warn:   { q:'Предупреди заранее', t:'Договорились. За 3 дня до 25-го напишу, если остаток будет ниже обычного.', end:true },
    save:   { q:'Откладывать с зарплаты', t:'Настрою автоперевод 2 000 ₽ в копилку в день зарплаты. Сумму можно поменять в любой момент.', end:true },
    shift:  { q:'Перенести списания', t:'Покажу 4 подписки и предложу новые даты списаний — ближе к началу месяца.', end:true },
    review: { q:'Разобрать траты месяца', t:'Открою аналитику за вторую половину месяца и покажу, что съедает бюджет.', end:true }
  };

  function show(id){ screens.forEach(function(s){ document.getElementById(s).hidden = s !== id; }); }

  function openChat(from){
    cameFrom = from; feed.innerHTML = ''; intro.hidden = false; busy = false; show('chat'); wrap.scrollTop = 0;
  }

  function fill(tplId){
    var frag = document.getElementById(tplId).content.cloneNode(true);
    var slot = frag.querySelector('[data-tail]');
    if (slot) slot.replaceWith(document.getElementById('tail').content.cloneNode(true));
    return frag;
  }

  function scrollTo(el){ wrap.scrollTo({ top: Math.max(0, el.offsetTop - 12), behavior:'smooth' }); }

  function ask(key){
    var it = Q[key]; if (!it || busy) return;
    busy = true; intro.hidden = true;
    [].forEach.call(feed.querySelectorAll('.sugg'), function(s){ s.classList.add('used'); });
    var um = document.createElement('div'); um.className = 'um'; um.innerHTML = '<div></div>';
    um.firstChild.textContent = it.q; feed.appendChild(um);
    var sk = document.createElement('div'); sk.className = 'skel';
    sk.innerHTML = '<div class="row"><img src="fig/taya-avatar.png" alt="">Тая думает…</div><i class="h"></i><i style="width:100%"></i><i style="width:92%"></i><i style="width:64%"></i>';
    feed.appendChild(sk);
    requestAnimationFrame(function(){ scrollTo(um); });
    setTimeout(function(){
      sk.remove();
      var ans = document.createElement('div'); ans.className = 'ans';
      if (it.a) ans.appendChild(fill(it.a));
      else {
        ans.appendChild(fill('a-short')); ans.querySelector('[data-text]').textContent = it.t;
        var sg = document.createElement('div'); sg.className = 'sugg';
        (it.next || []).forEach(function(k){ var b = document.createElement('button'); b.className = 'chip' + (k==='later'?' grey':''); b.dataset.ask = k; b.innerHTML = '<span></span>'; b.firstChild.textContent = Q[k].q; sg.appendChild(b); });
        if (it.end){ var h = document.createElement('button'); h.className='chip grey'; h.dataset.home='1'; h.innerHTML='<span>На главную</span>'; sg.appendChild(h); }
        ans.appendChild(sg);
      }
      [].forEach.call(ans.children, function(c, i){ c.style.animationDelay = (i * 70) + 'ms'; });
      feed.appendChild(ans); busy = false;
    }, it.a ? 1300 : 900);
  }

  document.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.go) show(b.dataset.go);
    else if (b.dataset.chat) openChat(b.dataset.chat);
    else if (b.dataset.ask) ask(b.dataset.ask);
    else if (b.dataset.dismiss) document.getElementById(b.dataset.dismiss).hidden = true;
    else if (b.dataset.home) show('home');
    else if (b.hasAttribute('data-toggle')) b.classList.toggle('on');
    else if (b.id === 'chatBack') show(cameFrom);
  });

  function fit(){ var ph=$('#phone'); if (innerWidth>500){ var k=Math.min(1,(innerHeight-40)/852); ph.style.transform='scale('+k+')'; } else ph.style.transform=''; var k2=ph.clientWidth/375; [].forEach.call(document.querySelectorAll('.fix'),function(f){f.style.transform='scale('+k2+')';}); }
  addEventListener('resize',fit); fit();

  // жёсткий свайп пуша, как на iOS
  (function(){
    var push = $('#push'); if (!push) return;
    var x0=0, dx=0, drag=false, moved=false, THRESH=90;
    function scale(){ var r = push.getBoundingClientRect().width; return r && push.offsetWidth ? r/push.offsetWidth : 1; }
    function down(e){ drag=true; moved=false; dx=0; x0=e.clientX; push.classList.remove('settling'); push.setPointerCapture&&push.setPointerCapture(e.pointerId); }
    function move(e){ if(!drag) return; dx=(e.clientX-x0)/scale(); if(Math.abs(dx)>6) moved=true;
      var d = dx; if (Math.abs(dx)>THRESH) d = (dx>0?1:-1)*(THRESH + (Math.abs(dx)-THRESH)*0.35); // резинка после порога
      push.style.transform='translateX('+d+'px)'; push.style.opacity = Math.max(.35, 1-Math.abs(dx)/420); }
    function up(){ if(!drag) return; drag=false; push.classList.add('settling');
      if (Math.abs(dx) > THRESH){ push.style.transform='translateX('+(dx>0?460:-460)+'px)'; push.style.opacity=0; setTimeout(function(){ show('receipt'); push.style.transform=''; push.style.opacity=''; push.classList.remove('settling'); }, 240); }
      else { push.style.transform=''; push.style.opacity=''; } }
    push.addEventListener('pointerdown', down);
    push.addEventListener('pointermove', move);
    push.addEventListener('pointerup', up);
    push.addEventListener('pointercancel', up);
    push.addEventListener('click', function(e){ if (moved){ e.preventDefault(); e.stopPropagation(); moved=false; } });
  })();
  var start = (location.hash || '').slice(1);
  var chain = { diag:['diag'], ops:['diag','ops'], options:['diag','options'], kub:['diag','options','kub'] };
  if (chain[start]) {
    openChat('home');
    (function run(i){ if (i >= chain[start].length) return; ask(chain[start][i]); setTimeout(function(){ run(i+1); }, 1500); })(0);
  } else if (start === 'chat') openChat('home');
  else show(screens.indexOf(start) > -1 ? start : 'lock');
})();
</script>
</body>
